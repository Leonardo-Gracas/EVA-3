# EVA 3 — site estático. O navegador do mestre é o servidor da mesa e todos
# conectam ao servidor de salas (Cloudflare Worker, pasta server/), que só repassa
# as mensagens. Nenhum dado de jogo passa pelo Netlify.
# O endereço do servidor (wss://eva3-salas.leo-gracas.workers.dev) já vem no código
# (src/net/socket.ts); VITE_SERVER_URL no Netlify só serve para trocá-lo.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: /sala/CODIGO cai no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A CSP é a principal barreira contra XSS: o navegador só executa script do
# próprio site e só conecta ao servidor de salas. Exceções da trilha sonora do mestre:
# player do YouTube (www.youtube.com, miniaturas em ytimg/ggpht), login do Google
# (accounts.google.com/gsi) e a API de playlists (www.googleapis.com).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.youtube.com/iframe_api https://www.youtube.com/s/player/ https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com https://yt3.ggpht.com https://*.googleusercontent.com; frame-src https://www.youtube.com https://accounts.google.com/gsi/; connect-src 'self' wss://eva3-salas.leo-gracas.workers.dev https://www.youtube.com/oembed https://www.googleapis.com/youtube/ https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
